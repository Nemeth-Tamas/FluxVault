[package]
name = "fluxvault"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4"
rust_xlsxwriter = "0.99.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
